<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality BM &middot; Delivery Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0E8; --surface:#FFFFFF; --surface-2:#E4E7DC; --line:#D5D9CC;
  --ink:#1C2321; --ink-muted:#5B655F; --ink-faint:#8B948A;
  --steel:#2B4C6F; --steel-ink:#0F2A42; --steel-bg:#DCE6EF;
  --amber:#C98A1A; --amber-ink:#5A3B08; --amber-bg:#F6E3BE;
  --green:#3F7D4E; --green-ink:#1C3F26; --green-bg:#DDEDE0;
  --rust:#B54A2C; --rust-ink:#5C2313; --rust-bg:#F5DDD3;
  --violet:#5B4E8C; --violet-ink:#2A2350; --violet-bg:#E4E0F2;
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#181C19; --surface:#20241F; --surface-2:#262B24; --line:#343A33;
    --ink:#EDEFE9; --ink-muted:#A9B0A4; --ink-faint:#727A6E;
    --steel-bg:#1E2E3E; --steel:#7CA6CC; --steel-ink:#CFE1F2;
    --amber-bg:#3B2E12; --amber:#E0A93D; --amber-ink:#F3D69B;
    --green-bg:#1D3323; --green:#6BB37D; --green-ink:#B9E0C3;
    --rust-bg:#3B2019; --rust:#DE8465; --rust-ink:#F2C3B0;
    --violet-bg:#2A2547; --violet:#B0A6E0; --violet-ink:#E2DCF6;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0; background:var(--bg); color:var(--ink);}
h1,h2,h3,h4{font-family:"Space Grotesk",sans-serif; font-weight:600; margin:0 0 4px;}
p{margin:0;}
button,input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink);}
input,select,textarea{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel); outline-offset:1px;}
label{display:block; font-size:12px; color:var(--ink-muted); margin:0 0 4px; font-weight:500;}
.field{margin-bottom:12px;}
button{cursor:pointer;}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 14px; font-weight:600; font-size:13px; color:var(--ink); display:inline-block; text-decoration:none; line-height:1.2; vertical-align:middle;}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{background:var(--steel); border-color:var(--steel); color:#fff;}
.btn-primary:hover{opacity:0.92;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{color:var(--rust); border-color:var(--rust-bg);}
.btn-sm{padding:6px 10px; font-size:12px;}
.pill{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600;}
.pill-steel{background:var(--steel-bg); color:var(--steel-ink);}
.pill-amber{background:var(--amber-bg); color:var(--amber-ink);}
.pill-green{background:var(--green-bg); color:var(--green-ink);}
.pill-rust{background:var(--rust-bg); color:var(--rust-ink);}
.pill-violet{background:var(--violet-bg); color:var(--violet-ink);}
.pill-muted{background:var(--surface-2); color:var(--ink-muted);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px;}
#app{min-height:100vh; display:flex;}
.sidebar{width:220px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.brand .mark{width:34px; height:34px; border-radius:8px; background:var(--steel); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Space Grotesk"; font-weight:700; font-size:15px; margin-bottom:8px;}
.brand h1{font-size:15px; line-height:1.3;}
.brand p{font-size:12px; color:var(--ink-muted);}
.nav{display:flex; flex-direction:column; gap:2px;}
.nav button{text-align:left; background:transparent; border:none; border-radius:8px; padding:9px 10px; font-size:13.5px; font-weight:500; color:var(--ink-muted);}
.nav button.active{background:var(--steel-bg); color:var(--steel-ink); font-weight:600;}
.nav button:hover:not(.active){background:var(--surface-2); color:var(--ink);}
.session{margin-top:auto; border-top:1px solid var(--line); padding-top:14px;}
.session .who{font-size:13px; font-weight:600;}
.session .role{font-size:12px; color:var(--ink-muted); margin-bottom:10px;}
main{flex:1; min-width:0; padding:28px 32px 60px; max-width:1180px;}
.pagehead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.pagehead p{color:var(--ink-muted); font-size:13.5px; margin-top:2px;}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:24px;}
.stat{background:var(--surface-2); border-radius:10px; padding:14px;}
.stat .n{font-family:"Space Grotesk"; font-size:26px; font-weight:700;}
.stat .l{font-size:12px; color:var(--ink-muted); margin-top:2px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-faint); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line);}
td{padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
tr:last-child td{border-bottom:none;}
.row-click{cursor:pointer;}
.row-click:hover{background:var(--surface-2);}
.empty{color:var(--ink-faint); font-size:13.5px; padding:30px 10px; text-align:center; border:1px dashed var(--line); border-radius:10px;}
.modal-bg{position:fixed; inset:0; background:rgba(20,24,20,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
.modal{background:var(--surface); border-radius:14px; padding:24px; width:100%; max-width:580px; border:1px solid var(--line);}
.modal h2{font-size:17px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap;}
.item-row{display:grid; grid-template-columns:110px 1fr 32px; gap:8px; align-items:center; margin-bottom:8px;}
.itemhead{display:grid; grid-template-columns:110px 1fr 32px; gap:8px; font-size:11px; color:var(--ink-faint); margin-bottom:6px;}
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
.login-box{max-width:380px; width:100%;}
.itemline{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.itemline:last-child{border-bottom:none;}
.itemline .name{flex:1;}
.muted{color:var(--ink-muted);}
.faint{color:var(--ink-faint); font-size:12.5px;}
.err{color:var(--rust); font-size:12.5px; margin-top:8px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:500; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s;}
.toast.show{opacity:1;}
.kanban{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.kcol{background:var(--surface-2); border-radius:12px; padding:12px; max-height:70vh; overflow-y:auto;}
.kcol h4{font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); margin-bottom:10px; display:flex; justify-content:space-between;}
.kcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer; font-size:13px;}
.kcard:hover{border-color:var(--steel);}
.kcard b{display:block; font-size:13.5px; margin-bottom:2px;}
.hist{max-height:180px; overflow-y:auto; border-top:1px solid var(--line); margin-top:14px; padding-top:10px;}
.hist-row{font-size:12.5px; padding:5px 0; color:var(--ink-muted); border-bottom:1px dashed var(--line);}
.hist-row:last-child{border-bottom:none;}
.hist-row b{color:var(--ink); font-weight:600;}
@media (max-width:900px){ .kanban{grid-template-columns:repeat(2,1fr);} }
@media (max-width:600px){ .kanban{grid-template-columns:1fr;} }
@media (max-width:760px){
  #app{flex-direction:column;}
  .sidebar{position:relative; width:100%; height:auto; flex-direction:row; align-items:center; overflow-x:auto;}
  .brand{display:none;}
  .nav{flex-direction:row;}
  .session{margin-top:0; border-top:none; padding-top:0; border-left:1px solid var(--line); padding-left:12px; margin-left:auto;}
  main{padding:20px 16px 60px;}
}
</style>
</head>
<body>
<div id="app"><div class="login-wrap"><p class="faint">Loading&hellip;</p></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc, onSnapshot, query, where, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCr4ZfBTssAOHsHlkdbw_gOggaIV9hofLU",
  authDomain: "rbmdeliverysystem.firebaseapp.com",
  projectId: "rbmdeliverysystem",
  storageBucket: "rbmdeliverysystem.firebasestorage.app",
  messagingSenderId: "92695045485",
  appId: "1:92695045485:web:31698eaa6e078a4fb76664"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const STATUS_LABEL = { ordered:"Ordered", getting_ready:"Getting ready", in_transit:"In transit", delivered:"Delivered" };
const STATUS_PILL = { ordered:"pill-muted", getting_ready:"pill-amber", in_transit:"pill-steel", delivered:"pill-green" };
const STATUS_ORDER = ["ordered","getting_ready","in_transit","delivered"];
const NEXT_STATUS = { ordered:"getting_ready", getting_ready:"in_transit", in_transit:"delivered" };
const NEXT_LABEL = { ordered:"Start getting ready", getting_ready:"Mark in transit", in_transit:"Mark delivered" };

let profile = null;
let state = { customers: [], drivers: [], invoices: [], users: [], sites: [], secrets: [] };
let unsubs = [];
let ui = { view: null, modal: null, draftPending: null, loginError: "",
  overviewSearch: "", overviewStatus: "",
  invoicesSearch: "", invoicesStatus: "",
  pendingOrdersStatus: "",
  pendingItemsCustomer: "",
  sitesCustomer: "",
  customersSearch: "", driversSearch: "", usersSearch: "", sitesSearch: "",
  bulkEdit: false, bulkEditSites: false, importProgress: null };

function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(ts){ if(!ts) return ""; return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function fmtDateTime(ts){ if(!ts) return ""; return new Date(ts).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }
function showToast(msg){ const t=el("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function customerById(id){ return state.customers.find(c=>c.id===id); }
function driverById(id){ return state.drivers.find(d=>d.id===id); }
function siteById(id){ return state.sites.find(s=>s.id===id); }
function sitesOfCustomer(cid){ return state.sites.filter(s=>s.customerId===cid); }
function mapUrlFor(site){
  if(!site) return null;
  const raw = (site.mapLink||"").trim();
  if(raw) return /^https?:\/\//i.test(raw) ? raw : "https://"+raw;
  if(site.address) return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(site.address);
  return null;
}
function pendingOf(inv){ return (inv.pendingItems||[]).filter(p=>!p.fulfilled); }
function waLink(phone, text){ const digits=String(phone||"").replace(/[^0-9]/g,""); return "https://wa.me/"+digits+"?text="+encodeURIComponent(text); }
function byCreatedDesc(a,b){ return (b.createdAt||0)-(a.createdAt||0); }
function slugifyUsername(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function reverseStr(s){ return String(s||"").trim().split("").reverse().join(""); }
function secretFor(uid){ const s = state.secrets.find(x=>x.id===uid); return s ? s.initialPasswordHint : null; }
function matchesSearch(inv, term){
  if(!term) return true;
  const t = term.toLowerCase();
  const cust = customerById(inv.customerId);
  const hay = [inv.invoiceNumber, inv.doNumber, cust?cust.name:"", cust?cust.company:""].join(" ").toLowerCase();
  return hay.indexOf(t) > -1;
}
function searchBox(id, value, placeholder){
  return `<input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}" style="max-width:280px;">`;
}
function statusFilterHtml(id, value){
  return `<select id="${id}" style="max-width:170px;"><option value="">All statuses</option>${STATUS_ORDER.map(s=>`<option value="${s}" ${value===s?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select>`;
}
function customerFilterHtml(id, value){
  return `<select id="${id}" style="max-width:220px;"><option value="">All customers</option>${state.customers.map(c=>`<option value="${c.id}" ${value===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>`;
}
function textMatch(fields, term){
  if(!term) return true;
  return fields.join(" ").toLowerCase().indexOf(term.toLowerCase()) > -1;
}
function histLine(text){ return { at:Date.now(), byName:profile.name, byRole:profile.role, text }; }
function withHist(inv, text){ const h=(inv.history||[]).slice(-39); h.push(histLine(text)); return h; }
function buildStatusMessage(inv){
  const cust = customerById(inv.customerId);
  const driver = inv.driverId ? driverById(inv.driverId) : null;
  const pend = pendingOf(inv);
  const lines = [];
  lines.push("Hi "+(cust?cust.name:"there")+", update on your order "+inv.invoiceNumber+(inv.doNumber?" (DO "+inv.doNumber+")":"")+" from Reality Building Materials:");
  lines.push("Status: "+(STATUS_LABEL[inv.status]||inv.status));
  if(inv.totalItems) lines.push("Items: "+inv.totalItems+" total"+(pend.length ? ", "+pend.length+" pending (will follow separately)" : ", all ready"));
  if(driver && inv.status==="in_transit") lines.push("Driver: "+driver.name+(driver.phone?" ("+driver.phone+")":""));
  if(inv.notes) lines.push("Note: "+inv.notes);
  lines.push("\u2014 Reality BM");
  return lines.join("\n");
}

/* ---------------- auth / bootstrap ---------------- */

onAuthStateChanged(auth, async (user) => {
  cleanupListeners();
  if(!user){ profile=null; render(); return; }
  try{
    const snap = await getDoc(doc(db,"users",user.uid));
    if(!snap.exists()){
      ui.loginError = "Your account has no role assigned yet. Ask an admin to set it up.";
      await signOut(auth);
      return;
    }
    const d = snap.data();
    profile = { uid:user.uid, name:d.name||user.email, role:d.role, customerId:d.customerId||null, driverId:d.driverId||null };
    ui.view = null;
    startListeners();
  }catch(e){
    ui.loginError = "Could not load your account. Try again.";
    render();
  }
});

function cleanupListeners(){ unsubs.forEach(u=>u&&u()); unsubs=[]; }

function startListeners(){
  const role = profile.role;

  if(role==="admin" || role==="counter" || role==="warehouse" || role==="driver"){
    unsubs.push(onSnapshot(collection(db,"customers"), snap=>{ state.customers = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  }
  unsubs.push(onSnapshot(collection(db,"drivers"), snap=>{ state.drivers = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));

  if(role==="customer"){
    const siteQ = query(collection(db,"sites"), where("customerId","==",profile.customerId));
    unsubs.push(onSnapshot(siteQ, snap=>{ state.sites = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  } else {
    unsubs.push(onSnapshot(collection(db,"sites"), snap=>{ state.sites = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  }

  if(role==="customer"){
    const invQ = query(collection(db,"invoices"), where("customerId","==",profile.customerId));
    unsubs.push(onSnapshot(invQ, snap=>{ state.invoices = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  } else if(role==="driver"){
    const invQ = query(collection(db,"invoices"), where("driverId","==",profile.driverId));
    unsubs.push(onSnapshot(invQ, snap=>{ state.invoices = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  } else {
    unsubs.push(onSnapshot(collection(db,"invoices"), snap=>{ state.invoices = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  }
  if(role==="admin" || role==="counter"){
    unsubs.push(onSnapshot(collection(db,"users"), snap=>{ state.users = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  }
  if(role==="admin"){
    unsubs.push(onSnapshot(collection(db,"secrets"), snap=>{ state.secrets = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  }
  render();
}

/* ---------------- render root ---------------- */

function render(){
  const app = el("app");
  if(!profile){ app.innerHTML = renderLogin(); bindLogin(); return; }
  app.innerHTML = renderShell();
  bindShell();
}

function renderLogin(){
  return `<div class="login-wrap"><div class="login-box">
    <div class="brand" style="margin-bottom:18px;">
      <div class="mark">RB</div>
      <h1>Reality BM &middot; Delivery Control</h1>
      <p>Sign in with the account your admin created for you</p>
    </div>
    <div class="field"><label>Email or username</label><input id="li-email" placeholder="name@company.com or your username"></div>
    <div class="field"><label>Password</label><input id="li-pass" type="password" placeholder="Password"></div>
    <button class="btn btn-primary" id="li-submit" style="width:100%;">Sign in</button>
    ${ui.loginError ? `<p class="err">${esc(ui.loginError)}</p>` : ""}
  </div></div>`;
}
function bindLogin(){
  el("li-submit").addEventListener("click", async ()=>{
    ui.loginError = "";
    const raw = el("li-email").value.trim();
    const pass = el("li-pass").value;
    if(!raw || !pass){ ui.loginError="Enter your email/username and password."; render(); return; }
    let email = raw;
    if(raw.indexOf("@")===-1){
      try{
        const lookup = await getDoc(doc(db,"usernames",slugifyUsername(raw)));
        if(!lookup.exists()){ ui.loginError="No account found for that username."; render(); return; }
        email = lookup.data().email;
      }catch(e){ ui.loginError="Could not look up that username. Try again."; render(); return; }
    }
    try{ await signInWithEmailAndPassword(auth, email, pass); }
    catch(e){ ui.loginError = "Could not sign in. Check your details."; render(); }
  });
}

/* ---------------- shell ---------------- */

function navItemsFor(role){
  if(role==="admin" || role==="counter") return [["live","Live dashboard"],["overview","Overview"],["pendingorders","Pending orders"],["invoices","Invoices"],["pending","Pending items"],["sites","Site locations"],["customers","Customers"],["drivers","Drivers"],["users","Users & roles"]];
  if(role==="warehouse") return [["queue","Invoices"],["pendingorders","Pending orders"],["pending","Pending items"],["sites","Site locations"]];
  if(role==="driver") return [["mydeliveries","My deliveries"],["sites","Site locations"]];
  return [["myorders","My orders"],["sites","My sites"]];
}

function renderShell(){
  const role = profile.role;
  const items = navItemsFor(role);
  if(!ui.view || !items.some(n=>n[0]===ui.view)) ui.view = items[0][0];
  const navHtml = items.map(n=>`<button class="${ui.view===n[0]?"active":""}" data-nav="${n[0]}">${n[1]}</button>`).join("");
  const roleLabel = role==="admin"?"Admin":role==="counter"?"Counter":role==="warehouse"?"Warehouse":role==="driver"?"Driver":"Customer";
  return `<div class="sidebar">
      <div class="brand"><div class="mark">RB</div><h1>Reality BM</h1><p>Delivery Control</p></div>
      <nav class="nav">${navHtml}</nav>
      <div class="session">
        <div class="who">${esc(profile.name)}</div>
        <div class="role">${roleLabel}</div>
        <button class="btn btn-ghost btn-sm" data-act="signout">Sign out</button>
      </div>
    </div>
    <main id="main">${renderView()}</main>
    ${ui.modal ? renderModal() : ""}`;
}

function renderView(){
  const role = profile.role;
  if(role==="admin" || role==="counter"){
    if(ui.view==="live") return viewLive();
    if(ui.view==="overview") return viewOverview();
    if(ui.view==="pendingorders") return viewPendingOrders();
    if(ui.view==="invoices") return viewInvoicesAdmin();
    if(ui.view==="pending") return viewPending();
    if(ui.view==="sites") return viewSites();
    if(ui.view==="customers") return viewCustomers();
    if(ui.view==="drivers") return viewDrivers();
    if(ui.view==="users") return viewUsers();
  }
  if(role==="warehouse"){
    if(ui.view==="queue") return viewQueueWarehouse();
    if(ui.view==="pendingorders") return viewPendingOrders();
    if(ui.view==="pending") return viewPending();
    if(ui.view==="sites") return viewSites();
  }
  if(role==="driver"){
    if(ui.view==="mydeliveries") return viewMyDeliveries();
    if(ui.view==="sites") return viewSites();
  }
  if(role==="customer"){
    if(ui.view==="myorders") return viewMyOrders();
    if(ui.view==="sites") return viewSites();
  }
  return "";
}
function pageHead(title, sub, action){ return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div>${action||""}</div>`; }

async function saveBulkEditCustomers(){
  const rows = {};
  document.querySelectorAll("[data-bulk-field]").forEach(f=>{
    const id = f.getAttribute("data-id");
    const field = f.getAttribute("data-bulk-field");
    if(!rows[id]) rows[id] = {};
    rows[id][field] = f.value.trim();
  });
  const batch = writeBatch(db);
  let changed = 0;
  Object.keys(rows).forEach(id=>{
    const orig = customerById(id);
    if(!orig) return;
    const next = rows[id];
    const diff = {};
    ["name","company","phone","address"].forEach(f=>{ if((orig[f]||"") !== (next[f]||"")) diff[f] = next[f]; });
    if(Object.keys(diff).length){ batch.update(doc(db,"customers",id), diff); changed++; }
  });
  if(!changed){ showToast("No changes to save"); ui.bulkEdit=false; render(); return; }
  try{
    await batch.commit();
    showToast("Saved "+changed+" customer"+(changed===1?"":"s"));
    ui.bulkEdit = false;
    render();
  }catch(err){
    showToast("Could not save \u2014 "+(err.code||"try again"));
  }
}

        <span class="pill ${STATUS_PILL[inv.status]}">${STATUS_LABEL[inv.status]}</span>
      </div>
      <p style="margin-top:12px;">${inv.totalItems||0} items total${pend.length?`, <span style="color:var(--rust);">${pend.length} pending</span>`:", all ready"}</p>
      ${pend.length ? `<div style="margin-top:10px;">${pend.map(p=>`<div class="itemline"><span class="name">Item ${esc(p.itemNumber)}${p.note?" \u2014 "+esc(p.note):""}</span><span class="pill pill-rust">pending</span></div>`).join("")}</div>` : ""}
      ${showDriver ? `<p class="faint" style="margin-top:12px;">Driver: ${esc(driver.name)}${driver.phone?" \u00b7 "+esc(driver.phone):""}</p>` : ""}
      ${(()=>{ const site = inv.siteId ? siteById(inv.siteId) : null; if(!site) return ""; return `<div style="margin-top:10px; padding:10px 12px; background:var(--surface-2); border-radius:8px;">
        <b>${esc(site.siteName)}</b>${site.address?`<br><span class="faint">${esc(site.address)}</span>`:""}
        ${site.supervisorName?`<br>Site contact: ${esc(site.supervisorName)}${site.supervisorPhone?" \u00b7 "+esc(site.supervisorPhone):""}`:""}
      </div>`; })()}
      ${inv.notes ? `<p class="faint" style="margin-top:6px;">Note: ${esc(inv.notes)}</p>` : ""}
    </div>`;
  }).join("");
}

function renderModal(){
  const m = ui.modal;
  let inner="";
  if(m.type==="new-customer") inner = customerForm(null);
  if(m.type==="edit-customer") inner = customerForm(customerById(m.id));
  if(m.type==="new-driver") inner = driverForm(null);
  if(m.type==="edit-driver") inner = driverForm(driverById(m.id));
  if(m.type==="new-invoice") inner = newInvoiceForm();
  if(m.type==="new-user") inner = userForm(null);
  if(m.type==="edit-user") inner = userForm(state.users.find(u=>u.id===m.id));
  if(m.type==="new-site") inner = siteForm(null, m.forCustomerId||null, m.returnTo||null);
  if(m.type==="edit-site") inner = siteForm(siteById(m.id), null, m.returnTo||null);
  if(m.type==="customer-detail") inner = customerDetailView(m.id);
  if(m.type==="import-customers") inner = importCustomersForm();
  if(m.type==="import-sites") inner = importSitesForm();
  if(m.type==="open-invoice") inner = invoiceDetail(m.id);
  if(m.type==="followup") inner = followupForm(m.invId, m.itemId);
  return `<div class="modal-bg" data-act="close-modal-bg"><div class="modal">${inner}</div></div>`;
}

  const currentCust = (!lockedCust && s && s.customerId) ? customerById(s.customerId) : null;
  const custField = lockedCust
    ? `<input type="hidden" id="f-customer" value="${lockedCust.id}"><div class="field"><label>Customer</label><input value="${esc(lockedCust.name)}" disabled></div>`
    : `<div class="field" style="position:relative;">

        <input id="f-customer-search" autocomplete="off" placeholder="Search customer, or leave blank for unassigned" value="${currentCust?esc(currentCust.name):""}">

function customerDetailView(id){
  const c = customerById(id);
  if(!c) return `<p>Not found.</p><div class="modal-actions"><button class="btn" data-act="close-modal">Close</button></div>`;
  const sites = sitesOfCustomer(id);
  const linkedUser = state.users.find(u=>u.customerId===id && u.role==="customer");

  const sitesHtml = !sites.length ? `<p class="faint">No sites saved for this customer yet.</p>` :
    sites.map(s=>`<div class="itemline" style="align-items:flex-start;">
      <span class="name"><b>${esc(s.siteName)}</b>${s.address?`<br><span class="faint">${esc(s.address)}</span>`:""}${s.supervisorName?`<br><span class="faint">Contact: ${esc(s.supervisorName)}${s.supervisorPhone?" \u00b7 "+esc(s.supervisorPhone):""}</span>`:""}</span>
      <span style="white-space:nowrap;"><button class="btn btn-sm" data-act="edit-site" data-id="${s.id}" data-return="${id}">Edit</button> <button class="btn btn-sm btn-danger" data-act="del-site" data-id="${s.id}">Remove</button></span>
    </div>`).join("");

  let loginHtml;
  if(linkedUser){
    const pw = profile.role==="admin" ? secretFor(linkedUser.id) : null;
    loginHtml = `<p><b>Username:</b> ${esc(linkedUser.loginUsername||linkedUser.email||"\u2014")}</p>` +
      (profile.role==="admin"
        ? (pw ? `<p style="margin-top:4px;"><b>Password:</b> ${esc(pw)}</p>` : `<p style="margin-top:4px;" class="faint">Password not stored (created before this feature, or already changed).</p>`)
        : `<p style="margin-top:4px;" class="faint">Password is visible to Admin only.</p>`) +
      (linkedUser.email && linkedUser.email.indexOf("@customer.")===-1 ? `<button class="btn btn-sm" style="margin-top:8px;" data-act="reset-password" data-email="${esc(linkedUser.email)}">Send password reset email</button>` : "");
  } else {
    const previewUser = c.name ? slugifyUsername(c.name) : "";
    const previewPass = c.company ? reverseStr(c.company) : "";
    loginHtml = `<p class="faint">No login yet. It will be created as:</p>
      <p style="margin-top:4px;"><b>Username:</b> ${esc(previewUser)||"<i>needs a name</i>"} &middot; <b>Password:</b> ${esc(previewPass)||"<i>needs a company name, 6+ characters</i>"}</p>
      <button class="btn btn-sm btn-primary" style="margin-top:8px;" data-act="create-customer-login" data-id="${id}">Create login</button>`;
  }

  return `<h2>${esc(c.name)}</h2>
    <div class="field"><label>Name</label><input id="f-name" value="${esc(c.name)}"></div>
    <div class="field"><label>Company</label><input id="f-company" value="${esc(c.company||"")}"></div>
    <div class="field"><label>Phone (WhatsApp)</label><input id="f-phone" value="${esc(c.phone||"")}"></div>
    <div class="field"><label>Address</label><input id="f-address-c" value="${esc(c.address||"")}"></div>
    <div class="modal-actions" style="justify-content:flex-end;"><button class="btn btn-primary btn-sm" data-act="save-customer-detail" data-id="${id}">Save details</button></div>

    <div style="border-top:1px solid var(--line); margin-top:16px; padding-top:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3 style="font-size:14px;">Sites</h3>
        <button class="btn btn-sm btn-ghost" data-act="new-site-for" data-id="${id}">+ Add site</button>
      </div>
      ${sitesHtml}
    </div>

    <div style="border-top:1px solid var(--line); margin-top:16px; padding-top:14px;">
      <h3 style="font-size:14px; margin-bottom:8px;">Login</h3>
      ${loginHtml}
    </div>

    <div class="modal-actions"><button class="btn" data-act="close-modal">Close</button></div>`;

function invoiceDetail(id){
  const inv = state.invoices.find(i=>i.id===id);
  if(!inv) return `<p>Not found.</p><div class="modal-actions"><button class="btn" data-act="close-modal">Close</button></div>`;
  const cust = customerById(inv.customerId);
  const isAdmin = profile.role==="admin";
  const isCounter = profile.role==="counter";
  const isWarehouse = profile.role==="warehouse";
  const isFullEditor = isAdmin || isCounter;
  if(!ui.draftPending || ui.draftPending.invId!==id) ui.draftPending = { invId:id, items:(inv.pendingItems||[]).map(p=>({...p})) };
  const driverOptions = `<option value="">No driver assigned</option>` + state.drivers.map(d=>`<option value="${d.id}" ${inv.driverId===d.id?"selected":""}>${esc(d.name)}</option>`).join("");

  const pendingRows = `<div class="itemhead"><span>Item no.</span><span>Note</span><span></span></div>` +
    ui.draftPending.items.map((p,idx)=>`<div class="item-row">
      <input data-p-field="itemNumber" data-idx="${idx}" value="${esc(p.itemNumber)}" placeholder="e.g. 07">
      <input data-p-field="note" data-idx="${idx}" value="${esc(p.note||"")}" placeholder="optional note">
      <button class="btn btn-ghost btn-sm" data-act="remove-pending-row" data-idx="${idx}" aria-label="Remove">&times;</button>
    </div>`).join("");

  let body = `<h2>${esc(inv.invoiceNumber)}</h2>
    <p class="faint" style="margin-bottom:16px;">DO ${esc(inv.doNumber||"\u2014")} &middot; ${esc(cust?cust.name:"\u2014")} &middot; <span class="pill ${STATUS_PILL[inv.status]}">${STATUS_LABEL[inv.status]}</span></p>`;

  if(isFullEditor){
    const custOptions = state.customers.map(c=>`<option value="${c.id}" ${c.id===inv.customerId?"selected":""}>${esc(c.name)}</option>`).join("");
    body += `<div class="field"><label>Invoice number</label><input id="f-invnum-e" value="${esc(inv.invoiceNumber)}"></div>
      <div class="field"><label>DO number</label><input id="f-donum-e" value="${esc(inv.doNumber||"")}"></div>
      <div class="field"><label>Customer</label><select id="f-customer-e">${custOptions}</select></div>
      <div class="field"><label>Delivery site</label><select id="f-site-e">${siteOptionsHtml(inv.customerId, inv.siteId||null)}</select></div>
      <div class="field"><label>Total items</label><input id="f-total-e" type="number" min="0" value="${inv.totalItems||0}"></div>`;
  } else if(profile.role!=="customer" && profile.role!=="driver") {
    body += `<p style="margin-bottom:14px;">${inv.totalItems||0} items total</p>`;
  }

  const site = inv.siteId ? siteById(inv.siteId) : null;
  if(site){
    body += `<div class="card" style="margin-bottom:14px; padding:12px 14px;">
      <b>${esc(site.siteName)}</b>${site.address?`<p class="faint" style="margin-top:2px;">${esc(site.address)}</p>`:""}
      ${site.supervisorName?`<p style="margin-top:6px;">Site contact: ${esc(site.supervisorName)}${site.supervisorPhone?" \u00b7 "+esc(site.supervisorPhone):""}</p>`:""}
      ${mapUrlFor(site)?`<a class="btn btn-sm" style="margin-top:8px;" href="${esc(mapUrlFor(site))}" target="_blank" rel="noopener">Open map</a>`:""}
    </div>`;
  }


  if(isFullEditor || isWarehouse){
    const nextKey = NEXT_STATUS[inv.status];
    body += `<h3 style="font-size:14px; margin-bottom:8px;">Pending items (not available)</h3>${pendingRows}
      <button class="btn btn-sm btn-ghost" data-act="add-pending-row" style="margin-bottom:14px;">+ Add pending item</button>
      <div class="field"><label>Assign driver</label><select id="f-driver">${driverOptions}</select></div>
      <div class="modal-actions" style="justify-content:space-between;">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${nextKey ? `<button class="btn btn-sm" data-act="set-status" data-status="${nextKey}" data-inv="${inv.id}">${NEXT_LABEL[inv.status]}</button>` : ""}
          ${isFullEditor ? `<select id="f-status-override" style="width:auto; display:inline-block;">${STATUS_ORDER.map(s=>`<option value="${s}" ${s===inv.status?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select>
          <button class="btn btn-sm" data-act="override-status" data-inv="${inv.id}">Set status</button>` : ""}
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          ${isAdmin ? `<button class="btn btn-sm btn-danger" data-act="delete-invoice" data-inv="${inv.id}">Delete</button>` : ""}
          <button class="btn" data-act="close-modal">Close</button>
          <button class="btn btn-primary" data-act="save-invoice-detail" data-inv="${inv.id}">Save</button>
        </div>
      </div>
      <div class="hist">${(inv.history||[]).slice().reverse().map(h=>`<div class="hist-row"><b>${esc(h.byName)}</b> (${esc(h.byRole)}) \u2014 ${esc(h.text)} <span class="faint">${fmtDateTime(h.at)}</span></div>`).join("") || `<p class="faint">No activity yet.</p>`}</div>`;
  } else {
    const pend = pendingOf(inv);
    body += pend.length ? `<div>${pend.map(p=>`<div class="itemline"><span class="name">Item ${esc(p.itemNumber)}${p.note?" \u2014 "+esc(p.note):""}</span><span class="pill pill-rust">pending</span></div>`).join("")}</div>` : `<p class="faint">All items ready.</p>`;
    body += `<div class="modal-actions"><button class="btn" data-act="close-modal">Close</button></div>`;
  }

  if((isFullEditor||isWarehouse) && cust && cust.phone){
    body += `<div style="border-top:1px solid var(--line); margin-top:16px; padding-top:14px;">
      <a class="btn btn-sm" href="${waLink(cust.phone, buildStatusMessage(inv))}" target="_blank" rel="noopener">Share WhatsApp update</a>
      <button class="btn btn-sm btn-ghost" data-act="copy-message" data-inv="${inv.id}">Copy message</button>
    </div>`;
  }
  return body;
}

function bindSearchInput(id, onChange){
  const node = el(id);
  if(!node) return;
  node.addEventListener("input", ()=>{
    const pos = node.selectionStart;
    onChange(node.value);
    render();
    const again = el(id);
    if(again){ again.focus(); again.setSelectionRange(pos,pos); }
  });
}

function bindFilterSelect(id, onChange){
  const node = el(id);
  if(!node) return;
  node.addEventListener("change", ()=>{ onChange(node.value); render(); });
}

function bindShell(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click", ()=>{ ui.view=b.getAttribute("data-nav"); ui.modal=null; render(); }));
  const out = document.querySelector('[data-act="signout"]');

  main.addEventListener("click", mainClickHandler);

  bindSearchInput("invoices-search", v=>{ ui.invoicesSearch = v; });
  bindSearchInput("customers-search", v=>{ ui.customersSearch = v; });
  bindSearchInput("drivers-search", v=>{ ui.driversSearch = v; });
  bindSearchInput("users-search", v=>{ ui.usersSearch = v; });
  bindSearchInput("sites-search", v=>{ ui.sitesSearch = v; });

  bindFilterSelect("invoices-status", v=>{ ui.invoicesStatus = v; });

  bindFilterSelect("pending-customer-filter", v=>{ ui.pendingItemsCustomer = v; });
  bindFilterSelect("sites-customer-filter", v=>{ ui.sitesCustomer = v; });
  const modalBg = document.querySelector(".modal-bg");
  if(modalBg){
    modalBg.addEventListener("click", e=>{ if(e.target.getAttribute("data-act")==="close-modal-bg"){ ui.modal=null; ui.draftPending=null; render(); } });
    modalBg.addEventListener("click", modalClickHandler);
    const importFile = el("f-import-file");
    if(importFile){
      importFile.addEventListener("change", ()=>{
        const file = importFile.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ const ta = el("f-import-text"); if(ta) ta.value = String(reader.result||""); };
        reader.readAsText(file);
      });
    }
    const roleSel = el("f-role");
    if(roleSel){
      const sync = ()=>{ el("f-customer-wrap").style.display = roleSel.value==="customer" ? "block":"none"; el("f-driver-wrap").style.display = roleSel.value==="driver" ? "block":"none"; };
      roleSel.addEventListener("change", sync); sync();
    }
    const newCustSel = el("f-customer");
    const newSiteSel = el("f-site");
    if(newCustSel && newSiteSel && !el("f-invnum-e")){
      newCustSel.addEventListener("change", ()=>{ newSiteSel.innerHTML = siteOptionsHtml(newCustSel.value, null); });
    }
    const editCustSel = el("f-customer-e");
    const editSiteSel = el("f-site-e");
    if(editCustSel && editSiteSel){
      editCustSel.addEventListener("change", ()=>{ editSiteSel.innerHTML = siteOptionsHtml(editCustSel.value, null); });
    }
    bindCustomerPicker();
  }
}

function bindCustomerPicker(){
  const search = el("f-customer-search");
  const hidden = el("f-customer");
  const results = el("f-customer-results");
  if(!search || !hidden || !results) return;
  function showResults(q){
    const term = q.trim().toLowerCase();
    const matches = !term ? state.customers.slice(0,30) :
      state.customers.filter(c=>(c.name||"").toLowerCase().indexOf(term)>-1 || (c.company||"").toLowerCase().indexOf(term)>-1).slice(0,30);
    let html = `<button type="button" data-pick="" data-name="">Unassigned</button>`;
    html += matches.map(c=>`<button type="button" data-pick="${c.id}" data-name="${esc(c.name)}">${esc(c.name)}${c.company?" \u2014 "+esc(c.company):""}</button>`).join("");
    if(term && !matches.length) html += `<span class="faint" style="display:block; padding:10px 12px;">No match</span>`;
    results.innerHTML = html;
    results.style.display = "block";
    results.querySelectorAll("[data-pick]").forEach(btn=>{
      btn.addEventListener("mousedown", (e)=>{
        e.preventDefault();
        hidden.value = btn.getAttribute("data-pick");
        search.value = btn.getAttribute("data-name")||"";
        results.style.display = "none";
      });
    });
  }
  search.addEventListener("focus", ()=>showResults(search.value));
  search.addEventListener("input", ()=>showResults(search.value));
  search.addEventListener("blur", ()=>{ setTimeout(()=>{ results.style.display="none"; }, 150); });
}

function mainClickHandler(e){
  const open = e.target.closest("[data-open-invoice]");
  if(open){ ui.modal={type:"open-invoice", id:open.getAttribute("data-open-invoice")}; ui.draftPending=null; render(); return; }
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.getAttribute("data-act");
  if(act==="toggle-bulk-edit"){ ui.bulkEdit = !ui.bulkEdit; render(); return; }
  if(act==="save-bulk-edit"){ saveBulkEditCustomers(); return; }
  if(act==="open-import-customers"){ ui.modal={type:"import-customers"}; ui.importProgress=null; render(); return; }
  if(act==="toggle-bulk-edit-sites"){ ui.bulkEditSites = !ui.bulkEditSites; render(); return; }
  if(act==="save-bulk-edit-sites"){ saveBulkEditSites(); return; }
  if(act==="open-import-sites"){ ui.modal={type:"import-sites"}; ui.importProgress=null; render(); return; }
  if(act==="new-invoice"){ ui.modal={type:"new-invoice"}; render(); }
  else if(act==="new-customer"){ ui.modal={type:"new-customer"}; render(); }
  else if(act==="edit-customer"){ ui.modal={type:"edit-customer", id:b.getAttribute("data-id")}; render(); }
  else if(act==="open-customer"){ ui.modal={type:"customer-detail", id:b.getAttribute("data-id")}; render(); }
  else if(act==="new-driver"){ ui.modal={type:"new-driver"}; render(); }
  else if(act==="edit-driver"){ ui.modal={type:"edit-driver", id:b.getAttribute("data-id")}; render(); }
  else if(act==="new-user"){ ui.modal={type:"new-user"}; render(); }
  else if(act==="edit-user"){ ui.modal={type:"edit-user", id:b.getAttribute("data-id")}; render(); }
  else if(act==="new-site"){ ui.modal={type:"new-site"}; render(); }
  else if(act==="edit-site"){ ui.modal={type:"edit-site", id:b.getAttribute("data-id")}; render(); }
  else if(act==="del-site"){ if(confirm("Remove this site?")) deleteDoc(doc(db,"sites",b.getAttribute("data-id"))); }
  else if(act==="del-customer"){ if(confirm("Remove this customer?")) deleteDoc(doc(db,"customers",b.getAttribute("data-id"))); }
  else if(act==="del-driver"){ if(confirm("Remove this driver?")) deleteDoc(doc(db,"drivers",b.getAttribute("data-id"))); }
  else if(act==="open-followup"){ ui.modal={type:"followup", invId:b.getAttribute("data-inv"), itemId:b.getAttribute("data-item")}; render(); }
  else if(act==="driver-in-transit"){ driverMarkInTransit(b.getAttribute("data-inv")); }
  else if(act==="driver-delivered"){ driverMarkDelivered(b.getAttribute("data-inv")); }
}

async function modalClickHandler(e){

  else if(act==="edit-site"){ ui.modal={type:"edit-site", id:b.getAttribute("data-id"), returnTo:b.getAttribute("data-return")||null}; render(); }

    const id = b.getAttribute("data-id");
    const name = el("f-name").value.trim();

    if(!names.length){ showToast("Paste or upload some names first"); return; }

  else if(act==="run-import-sites"){

    const id = b.getAttribute("data-id");
    if(id){ await updateDoc(doc(db,"drivers",id), data); } else { await addDoc(collection(db,"drivers"), {...data, createdAt:Date.now()}); }
    ui.modal=null; render(); showToast(id?"Driver updated":"Driver added");
  } else if(act==="save-invoice"){

    const don = el("f-donum").value.trim();

    const total = parseInt(el("f-total").value,10)||0;

    const invId = b.getAttribute("data-inv");
    const itemId = b.getAttribute("data-item");

    if(!driverId){ showToast("Pick a driver for this delivery"); return; }

    const inv3 = state.invoices.find(i=>i.id===b.getAttribute("data-inv"));
    const msg = buildStatusMessage(inv3);
    if(navigator.clipboard) navigator.clipboard.writeText(msg).then(()=>showToast("Message copied"));

function syncPendingFromInputs(){
  if(!ui.draftPending) return;
  document.querySelectorAll("[data-p-field]").forEach(f=>{
    const idx = parseInt(f.getAttribute("data-idx"),10);
    const field = f.getAttribute("data-p-field");
    const it = ui.draftPending.items[idx];
    if(!it) return;
    it[field] = f.value;
  });
}

async function createFollowUpDelivery(invId, itemId, driverId){
  const inv = state.invoices.find(i=>i.id===invId);
  if(!inv) return;
  const target = (inv.pendingItems||[]).find(p=>p.id===itemId);
  if(!target) return;
  const newInv = {
    invoiceNumber: inv.invoiceNumber, doNumber: inv.doNumber||"", customerId: inv.customerId, siteId: inv.siteId||null,
    totalItems: 1, pendingItems: [], status: "ordered", driverId: driverId,
    notes: "Follow-up delivery for item "+target.itemNumber+(target.note?": "+target.note:"")+(inv.notes?" \u2014 "+inv.notes:""),
    createdAt: Date.now(), createdByUid: profile.uid, createdByName: profile.name, createdByRole: profile.role
  };
  newInv.history = [histLine("Created as follow-up for item "+target.itemNumber+" (same invoice/DO as "+inv.invoiceNumber+")")];
  const newRef = await addDoc(collection(db,"invoices"), newInv);

  const items = (inv.pendingItems||[]).map(p=> p.id===itemId ? {...p, fulfilled:true, fulfilledAt:Date.now()} : p);
  const hist = withHist(inv, "Item "+target.itemNumber+" ticked off \u2014 follow-up delivery created ("+newRef.id.slice(0,6)+")");
  await updateDoc(doc(db,"invoices",invId), { pendingItems:items, updatedAt:Date.now(), history:hist });
}

async function runCustomerImport(names){
  const existing = new Set(state.customers.map(c=>(c.name||"").trim().toLowerCase()));
  const seen = new Set();
  const toAdd = [];
  names.forEach(n=>{
    const key = n.toLowerCase();
    if(existing.has(key) || seen.has(key)) return;
    seen.add(key);
    toAdd.push(n);
  });
  if(!toAdd.length){ showToast("Nothing new to import \u2014 all names already exist"); return; }

  ui.importProgress = { done:0, total:toAdd.length };
  render();

  const CHUNK = 400;
  for(let i=0; i<toAdd.length; i+=CHUNK){
    const chunk = toAdd.slice(i, i+CHUNK);
    const batch = writeBatch(db);
    chunk.forEach(n=>{
      const ref = doc(collection(db,"customers"));
      batch.set(ref, { name:n, company:n, phone:"", address:"", createdAt:Date.now() });
    });
    try{ await batch.commit(); }
    catch(err){ showToast("Import stopped \u2014 "+(err.code||"error")+". "+ui.importProgress.done+" were added."); return; }
    ui.importProgress = { done: Math.min(i+CHUNK, toAdd.length), total: toAdd.length };
    render();
  }
  showToast("Imported "+toAdd.length+" customers");
}

async function runSiteImport(names){
  const existing = new Set(state.sites.map(s=>(s.siteName||"").trim().toLowerCase()));
  const seen = new Set();
  const toAdd = [];
  names.forEach(n=>{

  const CHUNK = 400;
  for(let i=0; i<toAdd.length; i+=CHUNK){
    const chunk = toAdd.slice(i, i+CHUNK);
    const batch = writeBatch(db);
    chunk.forEach(n=>{

async function createCustomerLogin(customerId){
  const c = customerById(customerId);
  if(!c) return;
  if(!c.name){ showToast("Add a name first"); return; }
  if(!c.company || reverseStr(c.company).length < 6){ showToast("Add a company name (6+ characters) to generate a password"); return; }
  const base = slugifyUsername(c.name);
  if(!base){ showToast("Name must contain letters or numbers"); return; }
  let username = base;
  let n = 1;
  while(true){
    let existing;
    try{ existing = await getDoc(doc(db,"usernames",username)); }
    catch(err){ showToast("Could not check username availability"); return; }
    if(!existing.exists()) break;
    n++; username = base + n;
    if(n>50){ showToast("Could not find a free username"); return; }
  }
  const password = reverseStr(c.company);
  const email = username + "@customer.rbmdeliverysystem.local";
  try{
    const secondary = getApps().find(a=>a.name==="Secondary") || initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondary);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    const newUid = cred.user.uid;
    await signOut(secondaryAuth);
    await setDoc(doc(db,"users",newUid), { name:c.name, email, role:"customer", customerId, driverId:null, loginUsername:username, createdAt:Date.now() });
    await setDoc(doc(db,"usernames",username), { email, customerId, createdAt:Date.now() });
    await setDoc(doc(db,"secrets",newUid), { initialPasswordHint:password, createdAt:Date.now() });
    await updateDoc(doc(db,"customers",customerId), { loginUsername:username });
    showToast("Login created \u2014 username: "+username);
    render();
  }catch(err){
    showToast("Could not create login \u2014 "+(err.code||"try again"));
  }
}

render();
</script>
</body>
